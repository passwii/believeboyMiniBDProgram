name: believeboy-mini-program

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-believeboy}
      POSTGRES_USER: ${POSTGRES_USER:-believeboy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-believeboy}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-believeboy} -d ${POSTGRES_DB:-believeboy}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  s3mock:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: content
    ports:
      - "9000:9090"

volumes:
  postgres-data:
