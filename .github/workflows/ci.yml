name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: believeboy
          POSTGRES_USER: believeboy
          POSTGRES_PASSWORD: believeboy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U believeboy -d believeboy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://believeboy:believeboy@localhost:5432/believeboy?sslmode=disable

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Verify generated SQL code
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code

  web:
    name: Web and Mini Program
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check admin
        run: pnpm --dir apps/admin check

      - name: Build admin
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --dir apps/admin build

      - name: Check viewer
        run: pnpm --dir apps/viewer check

      - name: Build viewer
        run: pnpm --dir apps/viewer build

      - name: Check mini program
        run: pnpm --dir apps/miniapp check
