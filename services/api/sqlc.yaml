version: "2"
sql:
  - engine: postgresql
    schema:
      - db/migrations/00001_init.sql
      - db/migrations/00002_viewer_ticket_session.sql
      - db/migrations/00003_security_retention_indexes.sql
      - db/migrations/00004_revocation_retention_indexes.sql
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
